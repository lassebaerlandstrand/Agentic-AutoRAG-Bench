[project]
name = "agentic-autorag-bench"
version = "0.1.0"
description = "Benchmark suite comparing Agentic AutoRAG against Random / Bayesian / Marker-Inc AutoRAG on public RAG benchmarks"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Lasse Bærland Strand" },
]
dependencies = [
    "agentic-autorag",
    "optuna>=3.6,<5.0",
    "pyarrow>=15",
    "pandas>=2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "numpy",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.10",
    "huggingface-hub>=0.20",
]

[project.scripts]
agentic-autorag-bench = "agentic_autorag_bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.uv.sources]
agentic-autorag = { path = "../Agentic-AutoRAG", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that need real LLM calls or heavy compute. Skipped by default, run with --run-slow.",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Frozen baseline code (Marker-Inc AutoRAG) kept on disk for resurrection
# but exempt from style checks. See agentic_autorag_bench/_deprecated/README.md.
extend-exclude = [
    "agentic_autorag_bench/_deprecated",
    "scripts/_deprecated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
extend-ignore = ["D102", "D103"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI params via Option/Argument calls in argument defaults —
# the idiomatic pattern, not a B008 mutable-default-argument bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_autorag_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_autorag_bench"]
