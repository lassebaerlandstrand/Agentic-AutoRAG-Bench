# SMOKE project config for MultiHop-RAG — see smoke_hotpot_project.yaml header.
# This corpus is full-length news articles (~1,760 words/doc) and includes
# null-query QA ("Insufficient information."), so it is the most important
# dataset to smoke. Same slim pool; corpus-specific examiner weights.

meta:
  project_name: "smoke-multihop-rag"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps. Content is journalistic prose: named
    entities and quotes, time-anchored events, and topic concentration
    inside each category. Multi-hop questions cross multiple articles in
    the same topic cluster.
  output_dir: "./results_smoke_multihop_rag/.shared_cache"
  max_trials: 2
  cache_max_gb: 10.0
  cost_aware: false

agent:
  examiner_model: "azure/gpt-4o-mini"
  optimizer_model: "azure/gpt-4o-mini"
  judge_model: "azure/gpt-4o-mini"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 8

examiner:
  exam_size: 12
  # MultiHop-RAG's long-article corpus yields few valid multi-hop questions per
  # anchor, so a low multiplier under-fills below the 0.5×exam_size floor and
  # aborts exam-gen. Keep this generous for the smoke.
  initial_question_multiplier: 8.0
  probe_selection: true
  neighborhood_min_chunks: 18
  neighborhood_min_words: 5000
  neighborhood_same_doc_weight: 0.3
  neighborhood_cross_doc_weight: 0.7
  min_doc_words: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    strategies: ["recursive"]
    chunk_token_size: { values: [256, 512] }
    chunk_token_overlap: { values: [0, 32] }

  embedding:
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-small-en-v1.5"

  retrieval:
    index_types: ["vector_only", "hybrid_bm25_vector"]
    top_k: { min: 3, max: 10 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  query_expansion:
    strategies: ["none", "multi_query"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    models:
      - "none"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: { min: 3, max: 10 }

  generator:
    models:
      - "azure/gpt-4o-mini"
      - "bedrock/qwen.qwen3-32b-v1:0"
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
