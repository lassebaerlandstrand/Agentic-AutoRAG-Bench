# SHAKE-OUT bench config — uses the REAL multihop project config (its actual
# 9-embedder / 8-generator pool, DeepSeek agents) to exercise the real model
# pools on the long-doc + null-query dataset at a realistic hold-out size.
# More trials than the smoke; 1 seed; 3 representative methods. NOT the paper run.

project_config: ./multihop_rag_paper_project.yaml

methods:
  - random
  - motpe_warmstart
  - agentic_score

seeds: [1]

budget:
  max_trials: 6

benchmark:
  name: multihop_rag
  split: MultiHopRAG
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/multihop_rag_val

hold_out:
  limit: 40
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10
  exclude_question_types: [null_query]

output_root: ./results_shake_multihop_rag
