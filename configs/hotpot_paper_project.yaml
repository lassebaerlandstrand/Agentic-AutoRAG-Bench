# Paper-mode framework project config — curated search space.
#
# Used by every method in the matrix as the source of truth for:
#   - search_space (TrialConfig dimensions every method searches over)
#   - examiner (the MCQ exam — generated once, cached, shared by methods 1/2/3/5)
#   - agent (proposer + judge LLMs)
#   - meta (corpus_path, output_dir, max_trials)
#   - parsing
#
# meta.output_dir is the SHARED cache (parsed corpus, exam.json, ingredient
# cache). Per-method results live under results/<method>/seed_<n>/ instead.
#
# 5 embeddings × 6 LLMs × 3 rerankers — tractable for AutoRAG enumeration,
# defensible as a paper-table footprint. All LLMs are azure/-prefixed so the
# bench runs against a single provider tier; this removes cross-provider
# latency/cost variance as a confound when comparing optimizers.

meta:
  project_name: "hotpot-paper-curated"
  corpus_path: "./benchmark_data/hotpot_val_2000/corpus"
  corpus_description: |
    HotpotQA distractor validation split, pooled 2000-question corpus:
    Wikipedia paragraph-level documents (2 gold + 8 distractors per question,
    deduplicated by title). Multi-hop reasoning, mostly 2 hops, bridge and
    comparison question types.
  output_dir: "./results/.shared_cache"
  max_trials: 10
  cache_max_gb: 5.0

agent:
  # Examiner composes the MCQ exam; needs reliable structured output across
  # ~exam_size questions. gpt-4o-mini is cheap and reliable.
  examiner_model: "azure/gpt-4o-mini"
  # Proposer (diagnoser + recommender) — benefits from reasoning. o4-mini is
  # the cheapest reasoning model in our pool.
  optimizer_model: "azure/o4-mini"
  # Trial-time judge: pin to gpt-4o so judge calls don't routinely depend on
  # whichever search-space LLM happens to be selected (auto-pick can land on
  # a flaky model). gpt-4o is strictly stronger than every search-space LLM
  # here for grading purposes.
  judge_model: "azure/gpt-4o"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  max_history_trials: 10
  concurrency: 10

examiner:
  exam_size: 100
  pair_overgeneration_factor: 5.0
  probe_selection: true
  composition_batch_size: 4
  composition_temperature: 1.0
  composition_temperature_numeric: 0.2
  question_type_weights:
    extraction: 0.10
    definitional: 0.05
    bridge: 0.40
    comparison: 0.25
    numeric: 0.20
  seed_mix:
    single_chunk: 0.10
    same_doc_pair: 0.10
    cross_doc_pair: 0.80
  same_doc_pair_cosine_min: 0.4
  same_doc_pair_cosine_max: 0.85
  pair_embedding_model: "BAAI/bge-m3"
  pair_top_k_per_chunk: 5
  doc_split_word_threshold: 120000
  doc_section_word_size: 500
  min_doc_words: 20
  eligible_section_types:
    - body
    - abstract
    - methods
    - results
    - discussion
    - other
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5
  retrieval_quality_alpha: 0.7
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  parser: "docling"
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { min: 256, max: 512 }
    chunk_token_overlap: { min: 0, max: 64 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
    - "intfloat/e5-large-v2"
    - "Alibaba-NLP/gte-large-en-v1.5"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none", "hyde", "multi_query"]
  llm_models:
    - "azure/gpt-4o"
    - "azure/gpt-4o-mini"
    - "azure/o4-mini"
    - "azure/gpt-5.1-chat"
    - "azure/gpt-5.4-mini"
    - "azure/gpt-5.4-nano"
  temperature: { min: 1.0, max: 1.0 }
  reasoning: true
  reasoning_effort: medium
