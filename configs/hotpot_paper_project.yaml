# Paper-scale framework project config.

meta:
  project_name: "hotpot-paper"
  corpus_path: "./benchmark_data/hotpot_val_2000/corpus"
  corpus_description: |
    English Wikipedia. Documents are short paragraph snippets (~50–100
    words each), one paragraph per page/entity rather than full articles.
    Content is encyclopedic prose: entity-centric, factoid-dense, neutral
    register.
  output_dir: "./results_hotpot/.shared_cache"
  max_trials: 20
  cache_max_gb: 20.0
  # Score-only mode for the paper's headline Table 1. Cost is still recorded
  # for post-hoc analysis but is hidden from the agentic optimizer's prompts:
  # no Pareto block, no polish stance, no knee anchor, no cheapest-in-band
  # signal. Every method (random / Bayesian / agentic / AutoRAG) optimizes
  # the same scalar objective so the headline number is apples-to-apples.
  # A separate Pareto matrix config will set this to true once written.
  cost_aware: false

agent:
  examiner_model: "azure_ai/DeepSeek-V3.2"
  optimizer_model: "azure_ai/DeepSeek-V3.2"
  judge_model: "azure_ai/DeepSeek-V3.2"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  exam_size: 80
  pair_overgeneration_factor: 1.6
  probe_selection: true
  # Neighborhood-builder thresholds. The composer sees a neighborhood per
  # call (anchor + same-doc siblings + cosine-similar cross-doc chunks). The
  # neighborhood grows until chunks >= min_chunks OR words >= min_words.
  # HotpotQA paragraphs are ~50-100 words each, so the 20-chunk floor binds
  # first (~2.0k words) and gives the composer enough raw material for
  # 3-hop chains.
  neighborhood_min_chunks: 20
  neighborhood_min_words: 5000
  # HotpotQA paragraphs are single-topic snippets, so same-document siblings
  # are sparse — cross-doc cosine neighbors carry essentially all the
  # multi-hop signal. Weights are normalized internally.
  neighborhood_same_doc_weight: 0.0
  neighborhood_cross_doc_weight: 1.0
  min_doc_words: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    # Frozen across all 6 methods. AutoRAG v0.3's ``chunk`` phase is decoupled
    # from ``evaluate`` — sweeping chunk_size/overlap there would require
    # running ``autorag chunk`` per (strategy, size, overlap) tuple.
    strategies: ["recursive"]
    chunk_token_size: { values: [512] }
    chunk_token_overlap: { values: [0] }

  embedding:
    models:
      - "IEITYuan/Yuan-embedding-2.0-en"                    # top         (MTEB retrieval 0.707)
      - "Qwen/Qwen3-Embedding-0.6B"                         # strong-mid  (0.618)
      - "ibm-granite/granite-embedding-english-r2"          # mid         (0.564)
      - "intfloat/e5-large-v2"                              # mid-low     (0.493)
      - "BAAI/bge-small-en-v1.5"                            # weak        (small variant of bge-large)
      - "sentence-transformers/all-MiniLM-L6-v2"            # weak        (0.430, max_tokens=256 -> chunks truncate at chunk=512)
      - "sentence-transformers/paraphrase-MiniLM-L6-v2"     # floor       (paraphrase-tuned, not retrieval-tuned)

  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    top_k: { values: [3, 5, 10, 20] }
    hybrid_alpha: { values: [0.0, 0.5, 1.0] }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false]

  query_expansion:
    strategies: ["none", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { values: [3, 5, 10] }

  generator:
    models:
      - "bedrock/openai.gpt-oss-20b-1:0"                              # top         (screen 82.5%/40Q, bench 0.75, fast 271 tok/s)
      - "vertex_ai/gemini-2.5-flash-lite"                             # runner-up   (screen 62.5%/40Q, stable, fast 253 tok/s)
      - "bedrock/us.meta.llama3-3-70b-instruct-v1:0"                  # mid         (screen 65%/40Q, bench 0.58)
      - "azure/gpt-4o-mini"                                           # mid         (screen 75%)
      - "bedrock/mistral.ministral-3-14b-instruct"                    # mid-low     (Mistral, MMLU 0.693 / GPQA 0.572)
      - "bedrock/us.amazon.nova-lite-v1:0"                            # weak        (screen 55%, MMLU 0.590 / GPQA 0.433)
      - "bedrock/google.gemma-3-4b-it"                                # floor       (screen 45%, MMLU 0.417 / GPQA 0.291)
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
