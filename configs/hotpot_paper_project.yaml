# Paper-scale framework project config.

meta:
  project_name: "hotpot-paper"
  corpus_path: "./benchmark_data/hotpot_val_2000/corpus"
  corpus_description: |
    English Wikipedia. Documents are short paragraph snippets (~50–100
    words each), one paragraph per page/entity rather than full articles.
    Content is encyclopedic prose: entity-centric, factoid-dense, neutral
    register. Corpus is pre-segmented at the paragraph boundary upstream
    of any chunker.
  output_dir: "./results_hotpot/.shared_cache"
  max_trials: 3
  cache_max_gb: 20.0
  # Score-only mode for the paper's headline Table 1. Cost is still recorded
  # for post-hoc analysis but is hidden from the agentic optimizer's prompts:
  # no Pareto block, no polish stance, no knee anchor, no cheapest-in-band
  # signal. Every method (random / Bayesian / agentic / AutoRAG) optimizes
  # the same scalar objective so the headline number is apples-to-apples.
  # A separate Pareto matrix config will set this to true once written.
  cost_aware: false

agent:
  examiner_model: "azure_ai/DeepSeek-V3.2"
  optimizer_model: "azure_ai/DeepSeek-V3.2"
  judge_model: "azure_ai/DeepSeek-V3.2"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  exam_size: 30
  pair_overgeneration_factor: 1.0
  probe_selection: true
  # Neighborhood-builder thresholds. The composer sees a neighborhood per
  # call (anchor + same-doc siblings + cosine-similar cross-doc chunks). The
  # neighborhood grows until chunks >= min_chunks OR words >= min_words.
  # HotpotQA paragraphs are ~50-100 words each, so the 18-chunk floor binds
  # first (~1.8k words) and gives the composer enough raw material for
  # 3-hop chains.
  neighborhood_min_chunks: 18
  neighborhood_min_words: 5000
  # HotpotQA paragraphs are single-topic snippets, so same-document siblings
  # are sparse — cross-doc cosine neighbors carry essentially all the
  # multi-hop signal. Weights are normalized internally.
  neighborhood_same_doc_weight: 0.0
  neighborhood_cross_doc_weight: 1.0
  min_doc_words: 20

  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    # Frozen across all 6 methods. AutoRAG v0.3's ``chunk`` phase is decoupled
    # from ``evaluate`` — sweeping chunk_size/overlap there would require
    # running ``autorag chunk`` per (strategy, size, overlap) tuple. Until
    # that engineering is in, freezing chunking keeps the comparison honest.
    # Size=512 fits every embedding's context window; overlap=0 avoids
    # cross-chunk leakage. Single-value DiscreteValues makes the pin explicit.
    strategies: ["recursive"]
    chunk_token_size: { values: [512] }
    chunk_token_overlap: { values: [0] }

  embedding:
    # 4 embedders — one per family. Ordered weak → strong so the search has
    # signal: MiniLM is a known floor; bge-m3 is the BAAI mid-tier workhorse;
    # e5-large-v2 represents the alt (Microsoft) family; arctic-embed-l-v2.0
    # is a 2025 Snowflake release. All have working vectordb mappings in
    # native_config.py.
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-m3"
      - "intfloat/e5-large-v2"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"

  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    # DiscreteValues grids for fairness: AutoRAG enumerates lists via
    # itertools.product, so every method draws top_k / hybrid_alpha /
    # reranker_top_n from the same option set. Coarse 3-value grids keep
    # the AutoRAG enumeration cost bounded.
    top_k: { values: [3, 10, 20] }
    hybrid_alpha: { values: [0.0, 0.5, 1.0] }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  # ``strategies`` is the stage gate ("none" → stage off); ``models`` is the
  # LLM pool consulted when a non-"none" strategy runs. Single cheap utility
  # LLM (gpt-4o-mini) so the QE choice is about *strategy*, not model.
  # Passage_compressor is deliberately omitted — no hotpot evidence it helps
  # and it adds an extra LLM stage to the pipeline; cleaner to focus the
  # search budget on retrieval + generation.
  query_expansion:
    strategies: ["none", "hyde", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    # 4 options: none + 3 mapped rerankers from native_config.RERANKER_MODULE_MAP.
    # Excludes Qwen3-Reranker-0.6B and mxbai-rerank-base-v2 — sentence-transformers
    # loads them with a random score head (architecture mismatch), so they
    # output noise. ``top_n`` only applies when reranker != none.
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { values: [3, 5, 10] }

  generator:
    # 6 generators, one per family — kept tight so the AutoRAG enumeration
    # cost (linear in pool size) stays bounded. Spans weak (llama-3.1-8b) to
    # strong (gpt-4o-mini), reasoning-style (o4-mini), OSS (gpt-oss-20b),
    # and two non-OpenAI families (Mistral, Qwen) to keep cross-family
    # signal in the search.
    models:
      - "bedrock/us.meta.llama3-1-8b-instruct-v1:0"
      - "azure/gpt-4o-mini"
      - "azure/o4-mini"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/qwen.qwen3-32b-v1:0"
    # AutoRAG cannot toggle model-native reasoning; pin to false so the
    # AutoRAG↔framework comparison stays apples-to-apples.
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
