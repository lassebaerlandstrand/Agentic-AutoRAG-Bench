# VALIDATION testrun — MuSiQue, 1 seed, full 40 trials, fresh gemini exam.
# Points at the REAL project config (gemini/kimi/deepseek roles, 32-gen pool) so
# the exam regenerates into the shared paper cache (./results_paper_musique/
# .shared_cache) and is reused by the eventual paper run; method results go to an
# ISOLATED output_root so this never touches the paper run dirs. Launch one
# method via -m (e.g. `-m agentic_score`). NOT the paper run.

project_config: ./musique_paper_project.yaml

methods:
  - agentic_score
  - agentic_nodiag
  - agentic_opro
  - motpe
  - motpe_warm
  - random

seeds: [1]

budget:
  max_trials: 40

benchmark:
  name: musique
  split: validation
  sample_size: 2417
  prep_seed: 42
  output_dir: ./benchmark_data/musique_val_2417

hold_out:
  limit: 300
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10

output_root: ./results_testrun_musique
