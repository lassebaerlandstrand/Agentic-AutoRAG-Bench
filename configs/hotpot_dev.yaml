# Dev-mode matrix config — tiny end-to-end run for verification.
#
# Goals:
#   - Run every sequential method to completion in minutes, not hours.
#   - Touch every code path (random sampling, optuna sampling, agentic
#     orchestrator) without paying a real research-scale bill.
#
# What this is NOT:
#   - A paper-table generator. Use configs/hotpot_paper.yaml for that.

project_config: ./hotpot_dev_project.yaml

methods:
  - random
  - bayesian
  - agentic
  - autorag_mcq    # requires .autorag-venv with AutoRAG[gpu]; set AUTORAG_PYTHON
  - autorag_ragas  # same venv; bootstrap QA against the project's examiner_model
                   # via Azure's OpenAI-compat v1 shim (see qa_ragas.py)

seeds: [1]

budget:
  max_trials: 3

hotpot:
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  limit: 100
  # Mirrors the paper config so the dev path exercises the Azure AI Foundry
  # (azure_ai/) route end-to-end. Without this, a credential or pricing
  # regression on the judge model only shows up at paper-run time.
  judge_model: azure_ai/deepseek-v3.2
  concurrency: 5

output_root: ./results_dev
