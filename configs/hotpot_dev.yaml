# Dev-mode matrix config — tiny end-to-end run for verification.
#
# Goals:
#   - Run every sequential method to completion in minutes, not hours.
#   - Touch every code path (random sampling, optuna sampling, agentic
#     orchestrator) without paying a real research-scale bill.
#
# What this is NOT:
#   - A paper-table generator. Use configs/hotpot_paper.yaml for that.

project_config: ./hotpot_dev_project.yaml

methods:
  - random
  - bayesian
  - agentic
  - autorag_mcq  # requires .autorag-venv with AutoRAG[gpu]; set AUTORAG_PYTHON
  # autorag_ragas: needs RAGAS bootstrap which calls OpenAI directly (not
  # Azure-friendly without code changes); deferred for dev.

seeds: [1]

budget:
  max_trials: 3

hotpot:
  split: validation
  sample_size: 30
  prep_seed: 7
  output_dir: ./benchmark_data/hotpot_val_30_seed7

hold_out:
  limit: 10
  judge_model: azure/gpt-4o-mini
  concurrency: 5

output_root: ./results_dev
