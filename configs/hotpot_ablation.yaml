# Hotpot-only ablation pass — runs AFTER the headline (configs/hotpot_paper.yaml)
# on the SAME frozen exam (shared via hotpot_paper_project.yaml's
# meta.output_dir → results_hotpot/.shared_cache). Mechanism evidence for the
# paper (AAAI-mandatory): isolate the two contributions of the agentic method.
#
#   agentic_nodiag  diagnosis-off (KB on): score − nodiag = value of the
#                   per-question diagnosis loop (contribution #2).
#   agentic_nokb    KB-off (diagnosis on): isolates KB grounding (contribution #3).
#
# Same project config, seeds, budget, and hold-out as the headline so the
# ablation bars are directly comparable to agentic_score's. No @k checkpoints
# (ablations report at the full 40-trial budget with error bars). Because this
# reuses results_hotpot/.shared_cache, run it only after the headline exam is
# frozen — it must NOT regenerate the exam.
#
#   uv run agentic-autorag-bench run --config configs/hotpot_ablation.yaml

project_config: ./hotpot_paper_project.yaml

methods:
  - agentic_nodiag     # diagnosis-off ablation (KB on); isolates the diagnosis loop
  - agentic_nokb       # KB-off ablation (diagnosis on); isolates KB grounding

seeds: [1, 2, 3]

budget:
  max_trials: 40

benchmark:
  name: hotpot_qa
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  limit: 300
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10

output_root: ./results_hotpot
