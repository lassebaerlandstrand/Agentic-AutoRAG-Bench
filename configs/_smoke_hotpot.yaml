# THROWAWAY smoke bench config — tiny Experiment-1 matrix to validate the
# pipeline + scheduler before the real 48h launch. Delete after smoke.
# Tests: exam load (custom_exam_path), RAG+judge pipeline, motpe_warm transfer
# prior (warm gate), agentic optimizer path + @2 checkpoint, kb_greedy held-out,
# and the scheduler's disk-truth completion + finalization (analyze).

project_config: ./_smoke_hotpot_project.yaml

methods:
  - random          # baseline pipeline + motpe_warm's transfer source
  - motpe_warm      # warm transfer prior (must run after random)
  - agentic_score   # headline optimizer LLM path + @2 checkpoint

seeds: [1]

budget:
  max_trials: 3

checkpoints:
  agentic_score: [2]

benchmark:
  name: hotpot_qa
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  qa_path: ./benchmark_data/hotpot_val_2000/splits/holdout_qa.json
  limit: 10
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 8

output_root: ./experiment-1/_smoke
