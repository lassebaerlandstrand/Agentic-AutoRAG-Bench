# SMOKE bench config — 2 trials × 2 seeds × all 5 headline methods, tiny
# hold-out. Exercises every method's code path on HotpotQA fast/cheap.
# Isolated output_root so it never touches the real results_* trees.

project_config: ./smoke_hotpot_project.yaml

methods:
  - random
  - motpe
  - motpe_warmstart
  - agentic_score
  - agentic_nokb

seeds: [1, 2]

budget:
  max_trials: 2

# One checkpoint to exercise the @k synthesis + held-out path.
checkpoints:
  agentic_score: [1]

benchmark:
  name: hotpot_qa
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  limit: 12
  judge_model: azure/gpt-4o-mini
  concurrency: 8

output_root: ./results_smoke_hotpot
