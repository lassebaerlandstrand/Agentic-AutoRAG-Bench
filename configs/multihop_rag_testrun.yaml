# VALIDATION testrun — MultiHop-RAG, 1 seed, full 40 trials, fresh gemini exam.
# Points at the REAL project config (gemini/kimi/deepseek roles, 32-gen pool) so
# the exam regenerates into the shared paper cache (./results_multihop_rag/
# .shared_cache) and is reused by the eventual paper run; method results go to an
# ISOLATED output_root so this never touches the paper run dirs. Launch one
# method via -m (e.g. `-m agentic_opro`). NOT the paper run.

project_config: ./multihop_rag_paper_project.yaml

methods:
  - agentic_score
  - agentic_nodiag
  - agentic_opro
  - motpe
  - motpe_warm
  - random

seeds: [1]

budget:
  max_trials: 40

benchmark:
  name: multihop_rag
  split: MultiHopRAG
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/multihop_rag_val

hold_out:
  limit: 300
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10
  exclude_question_types: [null_query]

output_root: ./results_testrun_multihop_rag
