# Paper-scale matrix config — score-only EMNLP Table 1 run on MultiHop-RAG.
# Mirrors hotpot_paper.yaml exactly (same methods, seeds, budget, hold-out
# settings) so the three benchmarks differ only in dataset.
#
# Currently dialled DOWN for iteration: single seed, 3 trials, 300-question
# hold-out. Bump these for the camera-ready run (see hotpot_paper.yaml for
# the canonical paper-scale numbers).
#
# Run a single method with: -m random  (or any subset present in `methods`).

project_config: ./multihop_rag_paper_project.yaml

methods:
  - random
  - bayesian
  - agentic_score   # cost_aware=False (highest-score)
  - agentic_cost    # cost_aware=True  (Pareto-aware)
  - autorag_our_exam  # requires .autorag-venv (run scripts/setup_autorag_venv.sh)
  - autorag_ragas     # same venv

seeds: [1]

budget:
  max_trials: 3

benchmark:
  name: multihop_rag
  split: MultiHopRAG
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/multihop_rag_val

hold_out:
  limit: 300
  judge_model: azure/o4-mini
  concurrency: 10

output_root: ./results_paper_multihop_rag
