# Paper-scale matrix config — score-only EMNLP Table 1 run on MultiHop-RAG.
# Mirrors hotpot_paper.yaml (same methods, seeds, budget, checkpoints, hold-out)
# so the three benchmarks differ only in dataset.
#
# Run a single method with: -m random  (or any subset present in `methods`).

project_config: ./multihop_rag_paper_project.yaml

methods:
  - agentic_score      # full agentic (cost_aware=False, KB on, diagnosis on)
  - agentic_nokb       # KB-off ablation
  - motpe_warmstart    # MO-TPE seeded with the agent's frozen KB prior
  - motpe              # cold MO-TPE (= syftr's optimizer)
  - random             # exploration floor

seeds: [1, 2, 3]

budget:
  max_trials: 40

checkpoints:
  agentic_score: [10, 20]

benchmark:
  name: multihop_rag
  split: MultiHopRAG
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/multihop_rag_val

hold_out:
  limit: 300
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10
  # MultiHop-RAG's null_query rows (12% of QA) have gold "Insufficient
  # information." and empty supporting docs. The free-form judge can't award
  # credit for them (the generation prompt forbids abstention; any abstention
  # routes to NO_ANSWER == wrong), so they'd deflate every method's headline
  # accuracy by a fixed dead-weight and compress the between-method spread.
  # Dropped from scoring; the abstention subset is out of scope for this run.
  exclude_question_types: [null_query]

output_root: ./results_multihop_rag
