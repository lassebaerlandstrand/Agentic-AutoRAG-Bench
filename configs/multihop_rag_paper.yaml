# Paper-scale matrix config — score-only EMNLP Table 1 run on MultiHop-RAG.
# Mirrors hotpot_paper.yaml (same methods, seeds, budget, checkpoints, hold-out)
# so the three benchmarks differ only in dataset.
#
# Run a single method with: -m random  (or any subset present in `methods`).

project_config: ./multihop_rag_paper_project.yaml

methods:
  - agentic_score      # full agentic: KB on, diagnosis on — method under test
  - agentic_opro       # naive LLM proposer: compact (config→score) history, no KB, no diagnosis
  - motpe              # cold group-multivariate MO-TPE (syftr-class statistical search)
  - motpe_warm         # MO-TPE + free uncounted transfer prior from random (runs after random)
  - random             # exploration floor (also motpe_warm's transfer source)

seeds: [1, 2, 3]

budget:
  max_trials: 40

checkpoints:
  agentic_score: [10, 20]
  agentic_opro: [10, 20]

benchmark:
  name: multihop_rag
  split: MultiHopRAG
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/multihop_rag_val

hold_out:
  # Stratified, disjoint held-out slice (prepare-splits) — replaces the biased
  # contiguous qa.json[:limit] slice. The split already drops doc-less rows, so
  # MultiHop-RAG's 243 null_query rows are gone; ~300 stratified questions
  # remain, so limit is null.
  qa_path: ./benchmark_data/multihop_rag_val/splits/holdout_qa.json
  limit: null
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10
  # Belt-and-suspenders: the stratified split already excludes null_query rows
  # (empty supporting docs), but keep the filter so a stray abstention row can't
  # deflate the headline. Those rows have gold "Insufficient information." and
  # the free-form judge routes any abstention to NO_ANSWER == wrong.
  exclude_question_types: [null_query]

output_root: ./results_multihop_rag
