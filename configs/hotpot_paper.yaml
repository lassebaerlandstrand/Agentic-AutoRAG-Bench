# Paper-scale matrix config — score-only EMNLP Table 1 run.
# (The companion Pareto matrix config will live alongside this one once
# written; that file flips meta.cost_aware to true in its project YAML.)
#
# Currently dialled DOWN for iteration: single seed, 10 trials, 100-question
# hold-out. Bump these before the camera-ready run:
#   seeds: [1, 2, 3]      # so bootstrap CIs narrow enough to distinguish methods
#   max_trials: 25        # trials/space ratio ≈ 0.03 over 864 discrete configs
#   hold_out.limit: 500   # tighter CIs on the held-out HotpotQA-gold scoring
#
# Run a single method with: -m random  (or any subset present in `methods`).

project_config: ./hotpot_paper_project.yaml

methods:
  - random
  - bayesian
  - agentic
  - autorag_mcq    # requires .autorag-venv (run scripts/setup_autorag_venv.sh)
  - autorag_ragas  # same venv

seeds: [1]

budget:
  max_trials: 3

benchmark:
  name: hotpot_qa
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  limit: 300
  judge_model: azure/o4-mini
  concurrency: 10

output_root: ./results_paper
