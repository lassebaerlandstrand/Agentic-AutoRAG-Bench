# Paper-scale matrix config — HotpotQA score-only EMNLP Table 1 run.
# (A Pareto matrix config can live alongside this once written; it would
# flip ``meta.cost_aware`` to true in the project YAML and drop
# ``agentic_score`` in favour of ``agentic_cost``.)
#
# Default iteration knobs assume the wide search space defined in
# ``hotpot_paper_project.yaml`` (14 embedders × ~43 generators × continuous
# top_k/hybrid_alpha × ...). Dial down inline overrides for dev runs.

project_config: ./hotpot_paper_project.yaml

methods:
  - agentic_score   # cost_aware=False (highest-score)
  - agentic_cost    # cost_aware=True (Pareto-aware)
  - random
  - bayesian

seeds: [1, 2, 3]

budget:
  max_trials: 40

# Per-method early-stopping checkpoints: after a method's full
# ``max_trials``-budget search finishes, also evaluate the best config seen
# in ``history[:k]`` on the held-out QA. Writes a sibling
# ``<method>@<k>/seed_<n>/`` directory per checkpoint. Lets the paper show
# "ours at trial k" vs. "baseline at trial max_trials" without paying for
# extra search trials. Random/Bayesian are not checkpointed (saves held-out
# judge cost — the headline question is "how does ours catch up to
# Bayesian/random when given fewer trials", not the inverse).
checkpoints:
  agentic_score: [10, 20]
  agentic_cost:  [10, 20]

benchmark:
  name: hotpot_qa
  split: validation
  sample_size: 2000
  prep_seed: 42
  output_dir: ./benchmark_data/hotpot_val_2000

hold_out:
  limit: 500
  judge_model: azure_ai/DeepSeek-V3.2
  concurrency: 10

output_root: ./results_hotpot
