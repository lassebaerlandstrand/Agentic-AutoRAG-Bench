# Paper-scale framework project config for MultiHop-RAG.
#
# Identical shape to hotpot_paper_project.yaml / musique_paper_project.yaml —
# same search space, same examiner / agent / parsing blocks — so the EMNLP
# Table 1 compares the same search across all three benchmarks. Only the
# corpus path, the shared-cache location, and corpus-specific examiner
# weights change.

meta:
  project_name: "multihop-rag-paper"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps. Content is journalistic prose: named
    entities and quotes, time-anchored events, and topic concentration
    inside each category. Multi-hop questions cross multiple articles in
    the same topic cluster.
  output_dir: "./results_paper_multihop_rag/.shared_cache"
  max_trials: 10
  cache_max_gb: 20.0
  # Score-only mode for the paper's headline Table 1. Cost is still recorded
  # for post-hoc analysis but is hidden from the agentic optimizer's prompts.
  # The ``agentic_cost`` bench method overrides this to ``true`` at runtime
  # so the same project_config drives both ``agentic_score`` and
  # ``agentic_cost`` runs.
  cost_aware: false

agent:
  examiner_model: "azure/o4-mini"
  optimizer_model: "azure/o4-mini"
  judge_model: "azure/o4-mini"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  exam_size: 100
  pair_overgeneration_factor: 6.0
  probe_selection: true
  # Neighborhood-builder thresholds. MultiHop-RAG news articles are longer
  # than HotpotQA paragraphs (full-article length, multiple chunks per doc),
  # so the word floor binds first — 12 chunks at ~400-500 words/chunk reaches
  # the 5k-word target with room for both within-article and cross-article
  # context.
  neighborhood_min_chunks: 12
  neighborhood_min_words: 5000
  # News articles support within-article multi-hop (cross-section facts),
  # but the dataset's primary signal is cross-article reasoning in the same
  # topic cluster. Weight cross-doc heavier but admit some same-doc share
  # so the composer can build within-article bridges too.
  neighborhood_same_doc_weight: 0.2
  neighborhood_cross_doc_weight: 0.8
  min_doc_words: 50
  excluded_section_types:
    - references
    - acknowledgments
    - author_info
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    # Frozen across all 6 methods (matches hotpot_paper_project.yaml).
    strategies: ["recursive"]
    chunk_token_size: { values: [512] }
    chunk_token_overlap: { values: [0] }

  embedding:
    # 4 embedders — one per family. Weak → strong: MiniLM floor, bge-m3
    # mid-tier BAAI, e5-large-v2 alt (Microsoft) family, arctic-embed-l-v2.0
    # 2025 Snowflake release.
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-m3"
      - "intfloat/e5-large-v2"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"

  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    # Coarse 3-value grids: AutoRAG enumerates lists via itertools.product,
    # so every method draws from the same option set.
    top_k: { values: [3, 10, 20] }
    hybrid_alpha: { values: [0.0, 0.5, 1.0] }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  # Single cheap utility LLM (gpt-4o-mini) so the QE choice is about
  # *strategy*, not model. passage_compressor is deliberately omitted —
  # no multi-hop QA evidence it helps and it adds an extra LLM stage to
  # the pipeline.
  query_expansion:
    strategies: ["none", "hyde", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    # 4 options: none + 3 mapped rerankers from native_config.RERANKER_MODULE_MAP.
    # Excludes Qwen3-Reranker-0.6B and mxbai-rerank-base-v2 (sentence-transformers
    # loads them with a random score head — outputs noise). top_n only applies
    # when reranker != none.
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { values: [3, 5, 10] }

  generator:
    # 6 generators, one per family — spans weak (llama-3.1-8b) to strong
    # (gpt-4o-mini), reasoning-style (o4-mini), OSS (gpt-oss-20b), Mistral,
    # Qwen. AutoRAG enumeration cost is linear in pool size.
    models:
      - "bedrock/us.meta.llama3-1-8b-instruct-v1:0"
      - "azure/gpt-4o-mini"
      - "azure/o4-mini"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/qwen.qwen3-32b-v1:0"
    # AutoRAG cannot toggle model-native reasoning; pin to false so the
    # AutoRAG↔framework comparison stays apples-to-apples.
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
