# Paper-scale framework project config for MultiHop-RAG.
#
# Identical shape to hotpot_paper_project.yaml / musique_paper_project.yaml —
# same search space, same examiner / agent / parsing blocks — so the EMNLP
# Table 1 compares the same search across all three benchmarks. Only the
# corpus path, the shared-cache location, and corpus-specific examiner
# weights change.

meta:
  project_name: "multihop-rag-paper"
  corpus_path: "./benchmark_data/multihop_rag_val/corpus"
  corpus_description: |
    English-language news articles (~600 docs, full-article length) across
    technology, business, sports, entertainment, and health categories,
    with publication timestamps. Content is journalistic prose: named
    entities and quotes, time-anchored events, and topic concentration
    inside each category. Multi-hop questions cross multiple articles in
    the same topic cluster.
  output_dir: "./results_multihop_rag/.shared_cache"
  max_trials: 10
  cache_max_gb: 20.0
  # Score-only mode for the paper's headline Table 1. Cost is still recorded
  # for post-hoc analysis but is hidden from the agentic optimizer's prompts.
  # The ``agentic_cost`` bench method overrides this to ``true`` at runtime
  # so the same project_config drives both ``agentic_score`` and
  # ``agentic_cost`` runs.
  cost_aware: false

agent:
  examiner_model: "azure_ai/DeepSeek-V3.2"
  optimizer_model: "azure_ai/DeepSeek-V3.2"
  judge_model: "azure_ai/DeepSeek-V3.2"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  exam_size: 50
  initial_question_multiplier: 3.0
  probe_selection: true
  # Neighborhood-builder thresholds — unified across all three benchmarks.
  # ``target_extras = min(extras_for_chunks, extras_for_words)``, so whichever
  # floor needs fewer extras binds. On paragraph-snippet corpora (hotpot,
  # musique, median ~94 words/chunk) the 18-chunk floor binds first; on
  # full-article corpora (multihop news, median ~450 words/chunk) the 5k-word
  # floor binds first. Same config, corpus-appropriate behavior.
  neighborhood_min_chunks: 18
  neighborhood_min_words: 5000
  # Cross-doc dominant. On paragraph-per-doc corpora same-doc siblings don't
  # exist, so the weight is moot; on multi-chunk corpora the small same-doc
  # share is sacrificed for cross-benchmark uniformity.
  neighborhood_same_doc_weight: 0.3
  neighborhood_cross_doc_weight: 0.7
  min_doc_words: 20

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    # Frozen across all 6 methods. AutoRAG v0.3's ``chunk`` phase is decoupled
    # from ``evaluate`` — sweeping chunk_size/overlap there would require
    # running ``autorag chunk`` per (strategy, size, overlap) tuple.
    strategies: ["recursive"]
    chunk_token_size: { values: [512] }
    chunk_token_overlap: { values: [0] }

  embedding:
    models:
      - "intfloat/e5-large-v2"
      - "mixedbread-ai/mxbai-embed-large-v1"
      - "Alibaba-NLP/gte-multilingual-base"
      - "ibm-granite/granite-embedding-small-english-r2"
      - "BAAI/bge-m3"
      - "ibm-granite/granite-embedding-english-r2"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "IEITYuan/Yuan-embedding-2.0-en"

  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    top_k: { values: [3, 10, 20] }
    hybrid_alpha: { values: [0.0, 0.5, 1.0] }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false]

  query_expansion:
    strategies: ["none", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { values: [3, 5, 10] }

  generator:
    models:
      - "bedrock/google.gemma-3-12b-it"
      - "azure/gpt-4o-mini"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/qwen.qwen3-next-80b-a3b"
      - "azure/gpt-5.4-nano"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/openai.gpt-oss-120b-1:0"
      - "bedrock/nvidia.nemotron-super-3-120b"
    reasoning: false

  temperature: { min: 1.0, max: 1.0 }
