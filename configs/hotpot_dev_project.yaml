# Dev-mode framework project config.
#
# Same shape as hotpot_paper_project.yaml but minimized for fast iteration:
#   - 1 embedding model (smallest, no GPU pressure)
#   - 1 index type (vector_only — skip hybrid_bm25_vector)
#   - 1 reranker option (none)
#   - 2 LLMs (the two cheapest azure models)
#   - exam_size 30 (down from 100)
#   - max_trials 3 (overridden by bench, but kept consistent)

meta:
  project_name: "hotpot-dev"
  corpus_path: "./benchmark_data/hotpot_val_2000/corpus"
  corpus_description: |
    HotpotQA distractor validation split, pooled 2000-question corpus
    (~19k Wikipedia paragraph documents). Shared with the paper run; dev
    differs only in search space size, trial budget, and hold-out size.
  output_dir: "./results_dev/.shared_cache"
  max_trials: 3
  cache_max_gb: 5.0

agent:
  # All three set to azure/o4-mini for the experimentation phase per the
  # user's standing directive — keep dev consistent with hotpot_paper_project
  # so the proposer trajectory we observe here is representative of paper-run
  # behaviour, not a cheap-model artefact. Swap to a non-OpenAI judge for the
  # camera-ready run; see hotpot_paper_project.yaml comment.
  examiner_model: "azure/o4-mini"
  optimizer_model: "azure/o4-mini"
  judge_model: "azure/o4-mini"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 5

examiner:
  exam_size: 50
  pair_overgeneration_factor: 3.0
  probe_selection: true
  composition_batch_size: 4
  composition_temperature: 1.0
  question_type_weights:
    extraction: 0.10
    definitional: 0.05
    bridge: 0.40
    comparison: 0.25
    numeric: 0.20
  seed_mix:
    single_chunk: 0.10
    same_doc_pair: 0.10
    cross_doc_pair: 0.80
  same_doc_pair_cosine_min: 0.4
  same_doc_pair_cosine_max: 0.85
  pair_embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  pair_top_k_per_chunk: 5
  doc_split_word_threshold: 120000
  doc_section_word_size: 500
  min_doc_words: 20
  eligible_section_types:
    - body
    - abstract
    - methods
    - results
    - discussion
    - other
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5
  retrieval_quality_alpha: 0.7
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  parser: "docling"
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  chunking:
    # Frozen across all 5 methods: AutoRAG's chunk phase is decoupled from
    # ``evaluate`` (chunk_overlap is scalar-only in AutoRAG's YAML, no chunk
    # node exists inside the optimizer, no auto-selection), so giving Random
    # / Bayesian / Agentic a searchable chunking dimension AutoRAG can't
    # match would inflate their optimization power unfairly. Size=256 fits
    # every embedding in the search space (MiniLM caps at 256); overlap=0
    # avoids cross-chunk information leakage.
    strategies: ["recursive"]
    chunk_token_size: { values: [256] }
    chunk_token_overlap: { values: [0] }

  embedding:
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-large-en-v1.5"
      - "BAAI/bge-m3"

  retrieval:
    index_types:
      - "vector_only"
    # DiscreteValues grids match hotpot_paper_project.yaml shape but with
    # smaller fan-outs so the dev smoke run finishes in minutes.
    top_k: { values: [3, 10] }
    hybrid_alpha: { values: [0.0, 0.5, 1.0] }

  # query_expansion + passage_compressor are both pinned off in the dev run;
  # ``strategies: ["none"]`` makes the LLM pool unused, so ``models`` can be empty.
  query_expansion:
    strategies: ["none"]
    models: []

  reranker:
    models:
      - "none"
    top_n: { values: [3, 5] }

  passage_compressor:
    strategies: ["none"]
    models: []

  generator:
    models:
      - "azure/gpt-4o-mini"
      - "azure/gpt-5.4-nano"
      - "azure/o4-mini"
    reasoning: false
    reasoning_effort: medium

  temperature: { min: 1.0, max: 1.0 }
