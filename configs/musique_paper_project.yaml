# Paper-scale framework project config for MuSiQue.
#
# Search space + agent models are UNIFIED with hotpot_paper_project.yaml (and
# multihop) so the EMNLP table compares the same search across all three
# benchmarks — only corpus path, shared-cache location, and corpus-specific
# examiner weights differ.

meta:
  project_name: "musique-paper"
  corpus_path: "./benchmark_data/musique_val_2417/corpus"
  corpus_description: |
    English Wikipedia. Documents are short paragraph snippets (~50–100
    words each), one paragraph per page/entity rather than full articles.
    Content is encyclopedic prose: entity-centric, factoid-dense, neutral
    register. Corpus is pre-segmented at the paragraph boundary upstream
    of any chunker.
  output_dir: "./experiment-1/musique/.shared_cache"
  max_trials: 30
  cache_max_gb: 20.0
  # Score-only mode for the headline Table 1; cost is recorded but hidden from
  # the agentic optimizer's prompts so every method optimizes the same scalar.
  cost_aware: false

# Map short generator names to the LiteLLM deployment (gpt-5 family uses the
# -1 deployment suffix on this tenant).
model_aliases:
  azure/gpt-5-nano: azure/gpt-5-nano-1
  azure/gpt-5-mini: azure/gpt-5-mini-1
  azure/gpt-4.1-nano: azure/gpt-4.1-nano-1
  azure/gpt-4.1-mini: azure/gpt-4.1-mini-1

agent:
  examiner_model: "bedrock/minimax.minimax-m2.5"
  optimizer_model: "bedrock/moonshotai.kimi-k2.5"
  judge_model: "azure_ai/DeepSeek-V3.2"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  # Headline (Exp 1) optimizes against the validation exam built from MuSiQue's own
  # held-in questions (LLM-extracted, verify_source_facts-grounded tier-C spans),
  # not the corpus self-exam. Loaded via this path; generation is skipped.
  custom_exam_path: ./benchmark_data/musique_val_2417/validation_exam.json
  exam_size: 100
  initial_question_multiplier: 1.8
  probe_selection: true
  # Neighborhood-builder thresholds. MuSiQue chunks are the smallest (~60 words
  # median), so it needs more of them to match hotpot's word-content: the
  # 25-chunk floor binds (~1.5k words, vs hotpot's 20×81≈1.6k), still well
  # below the 5k-word floor. Gives the composer enough material for 2-4 hops.
  neighborhood_min_chunks: 25
  neighborhood_min_words: 5000
  # Wikipedia paragraphs are single-topic snippets — same-doc siblings
  # are sparse. Cross-doc cosine neighbors carry the multi-hop signal.
  neighborhood_same_doc_weight: 0.0
  neighborhood_cross_doc_weight: 1.0
  min_doc_words: 20
  excluded_section_types:
    - references
    - acknowledgments
    - author_info
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

parsing:
  ocr: false
  table_structure: false
  near_duplicate_detection_enabled: false
  near_duplicate_threshold: 0.85

# UNIFIED search space — identical to hotpot_paper_project.yaml.
search_space:
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { values: [128, 256, 384, 512] }
    chunk_token_overlap: { values: [0, 32, 48, 64] }

  embedding:
    models:
      - "IEITYuan/Yuan-embedding-2.0-en"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "ibm-granite/granite-embedding-english-r2"
      - "ibm-granite/granite-embedding-small-english-r2"
      - "intfloat/e5-large-v2"
      - "intfloat/multilingual-e5-large-instruct"
      - "BAAI/bge-large-en-v1.5"
      - "BAAI/bge-small-en-v1.5"
      - "BAAI/bge-m3"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"
      - "Snowflake/snowflake-arctic-embed-xs"
      - "mixedbread-ai/mxbai-embed-large-v1"
      - "sentence-transformers/all-MiniLM-L6-v2"

  retrieval:
    index_types: ["vector_only", "hybrid_bm25_vector"]
    top_k: { min: 3, max: 20 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  query_expansion:
    strategies: ["none", "hyde", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
      - "mixedbread-ai/mxbai-rerank-xsmall-v1"
    top_n: { min: 3, max: 10 }

  generator:
    models:
      - "bedrock/us.amazon.nova-micro-v1:0"
      - "bedrock/us.amazon.nova-lite-v1:0"
      - "bedrock/us.amazon.nova-pro-v1:0"
      - "bedrock/google.gemma-3-4b-it"
      - "bedrock/google.gemma-3-12b-it"
      - "bedrock/google.gemma-3-27b-it"
      - "bedrock/us.meta.llama3-1-8b-instruct-v1:0"
      - "bedrock/us.meta.llama3-3-70b-instruct-v1:0"
      - "bedrock/us.meta.llama4-scout-17b-instruct-v1:0"
      - "bedrock/us.meta.llama4-maverick-17b-instruct-v1:0"
      - "bedrock/mistral.magistral-small-2509"
      - "bedrock/mistral.ministral-3-3b-instruct"
      - "bedrock/mistral.ministral-3-8b-instruct"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/mistral.mistral-7b-instruct-v0:2"
      - "bedrock/mistral.mistral-large-3-675b-instruct"
      - "bedrock/mistral.mixtral-8x7b-instruct-v0:1"
      - "bedrock/nvidia.nemotron-nano-3-30b"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/openai.gpt-oss-120b-1:0"
      - "bedrock/qwen.qwen3-32b-v1:0"
      - "bedrock/qwen.qwen3-coder-30b-a3b-v1:0"
      - "bedrock/zai.glm-4.7"
      - "azure/gpt-4o"
      - "azure/gpt-4o-mini"
      - "azure/gpt-4.1-mini"
      - "azure/gpt-4.1-nano"
      - "azure/o4-mini"
      - "azure/gpt-5-mini"
      - "azure/gpt-5-nano"
      - "azure/gpt-5.4-mini"
      - "azure/gpt-5.4-nano"
      - "vertex_ai/gemini-2.5-flash"
      - "vertex_ai/gemini-2.5-flash-lite"
      - "vertex_ai/gemini-3.1-flash-lite-preview"
    reasoning: true
    reasoning_effort: medium

  temperature: { min: 1.0, max: 1.0 }
