# Recommended config: trial 24
# accuracy: 0.3700  cost/q: $0.0004
chunking_strategy: recursive
chunk_token_size: 256
chunk_token_overlap: 0
embedding_model: ibm-granite/granite-embedding-english-r2
index_type: hybrid_bm25_vector
top_k: 13
hybrid_alpha: 0.5
bm25_vector_fusion: rrf
long_context_reorder: false
passage_compressor: none
reranker: Alibaba-NLP/gte-reranker-modernbert-base
reranker_top_n: 7
query_expansion: multi_query
compressor_llm: null
expander_llm: azure/gpt-4o-mini
generator_llm: bedrock/openai.gpt-oss-120b-1:0
temperature: 1.0
reasoning: true
