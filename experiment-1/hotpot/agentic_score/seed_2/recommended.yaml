passage_compressor: none
reranker: BAAI/bge-reranker-v2-m3
reranker_top_n: 10
query_expansion: multi_query
compressor_llm: null
expander_llm: azure/gpt-4o-mini
generator_llm: azure/gpt-5.4-mini
temperature: 1.0
reasoning: true
