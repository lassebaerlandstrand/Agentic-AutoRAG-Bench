# Recommended config: trial 9
# accuracy: 0.8600  cost/q: $0.0015
chunking_strategy: recursive
chunk_token_size: 512
chunk_token_overlap: 64
embedding_model: Qwen/Qwen3-Embedding-0.6B
index_type: hybrid_bm25_vector
