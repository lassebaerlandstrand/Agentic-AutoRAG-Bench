# Recommended config: trial 10
# accuracy: 0.8300  cost/q: $0.0030
chunking_strategy: recursive
chunk_token_size: 512
chunk_token_overlap: 64
embedding_model: Snowflake/snowflake-arctic-embed-l-v2.0
index_type: hybrid_bm25_vector
top_k: 20
hybrid_alpha: 0.5
bm25_vector_fusion: rrf
long_context_reorder: true
passage_compressor: none
reranker: Alibaba-NLP/gte-reranker-modernbert-base
reranker_top_n: 10
query_expansion: hyde
compressor_llm: null
expander_llm: azure/gpt-4o-mini
generator_llm: azure/o4-mini
temperature: 1.0
reasoning: true
